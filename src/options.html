<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AskPage — Settings</title>
    <style>
      :root { color-scheme: dark light; font-family: -apple-system, system-ui, sans-serif; }
      body { margin: 0; padding: 24px; font-size: 13px; line-height: 1.5; max-width: 560px; }
      h1 { font-size: 18px; margin: 0 0 4px 0; }
      h2 { font-size: 12px; margin: 22px 0 8px 0; text-transform: uppercase; letter-spacing: 0.6px; opacity: 0.7; }
      .muted { opacity: 0.7; font-size: 12px; }
      .ok { color: #28a745; }
      .err { color: #d9534f; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-top: 8px; }
      label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; opacity: 0.9; }
      input[type="number"] {
        box-sizing: border-box;
        font-family: inherit;
        font-size: 13px;
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        background: rgba(127, 127, 127, 0.06);
        color: inherit;
      }
      .actions { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
      button {
        padding: 6px 16px;
        font-size: 13px;
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        background: rgba(127, 127, 127, 0.08);
        color: inherit;
      }
      button:hover { background: rgba(127, 127, 127, 0.16); }
      #status { font-size: 12px; }
      .picker { display: flex; gap: 6px; align-items: center; }
      .picker select { flex: 1; padding: 6px 8px; font-size: 13px; border-radius: 4px; border: 1px solid rgba(127, 127, 127, 0.35); background: rgba(127, 127, 127, 0.06); color: inherit; }
      .iconbtn { padding: 4px 8px; font-size: 14px; }
      input[type="url"], input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        font-family: ui-monospace, SFMono-Regular, monospace;
        font-size: 13px;
        padding: 6px 8px;
        border-radius: 4px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        background: rgba(127, 127, 127, 0.06);
        color: inherit;
      }
      label { margin-top: 10px; }
    </style>
  </head>
  <body>
    <h1>AskPage settings</h1>
    <p class="muted">
      Connection and tuning settings for AskPage.
    </p>

    <h2>Connection</h2>
    <div>
      <label for="base">AgentForge base URL</label>
      <input id="base" type="url" placeholder="https://agent.example.com" />
    </div>
    <div>
      <label for="apikey">API key</label>
      <input id="apikey" type="password" placeholder="API key (optional)" />
    </div>
    <div>
      <label for="provider">Provider</label>
      <div class="picker">
        <select id="provider"></select>
        <button type="button" id="refresh" class="iconbtn" title="Re-fetch providers">&#x21bb;</button>
      </div>
    </div>
    <div class="actions" id="conn-actions">
      <button type="button" id="conn-save">Save</button>
      <button type="button" id="conn-test">Test connection</button>
      <span id="conn-status"></span>
    </div>

    <h2>Auto-collect</h2>
    <div class="grid">
      <label>Max items
        <input id="collect-max-items" type="number" min="1" />
      </label>
      <label>Max scrolls
        <input id="collect-max-scrolls" type="number" min="1" />
      </label>
      <label>Idle scrolls to stop
        <input id="collect-idle" type="number" min="1" />
      </label>
      <label>Timeout (seconds)
        <input id="collect-timeout" type="number" min="1" />
      </label>
      <label>Wait between scrolls (ms)
        <input id="collect-wait" type="number" min="200" />
      </label>
    </div>

    <div class="actions">
      <button type="button" id="save">Save</button>
      <button type="button" id="reset">Reset to defaults</button>
      <span id="status"></span>
    </div>

    <script type="module" src="options.ts"></script>
  </body>
</html>
